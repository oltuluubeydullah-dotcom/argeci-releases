# ══════════════════════════════════════════════════════════════════════════
# Viziodex — BULUTTA YAYIN (Windows setup + otomatik güncelleme)
# ══════════════════════════════════════════════════════════════════════════
# Neden burada: bu depo PUBLIC → GitHub Actions dakikası ücretsiz ve sınırsız.
# Kaynak kod (argeci-ai) private kalır; yalnız bu iş akışı onu okur, derler ve
# kurulu programların baktığı yere (bu deponun Releases'i) setup + latest.yml koyar.
# Adımların hepsi depodaki `pnpm yayinla` betiğidir (PC'de koşanla birebir aynı:
# testler · lisans · sır taraması · paket taraması · yayın doğrulaması).
#
# Gerekli tek sır: KAYNAK_TOKEN — argeci-ai için fine-grained token,
#   Repository access: yalnız argeci-ai · Permissions: Contents = Read and write
#   (kararlı yayın sürüm commit'ini + etiketi argeci-ai main'e push'lar).
# Yükleme için ayrı token GEREKMEZ: bu deponun kendi GITHUB_TOKEN'ı release açar.
#
# Çalıştırma: Actions → "Viziodex yayın" → Run workflow → kanal seç.
# ══════════════════════════════════════════════════════════════════════════
name: Viziodex yayın

on:
  workflow_dispatch:
    inputs:
      kanal:
        description: "Kanal — kararli: bütün firmalar · beta: test PC'leri"
        type: choice
        options: [kararli, beta]
        default: kararli

permissions:
  contents: write

concurrency:
  group: viziodex-yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Kaynak kodu al (argeci-ai main)
        uses: actions/checkout@v4
        with:
          repository: oltuluubeydullah-dotcom/argeci-ai
          ref: main
          token: ${{ secrets.KAYNAK_TOKEN }}
          path: kaynak
          fetch-depth: 50

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Kurulum
        working-directory: kaynak
        run: pnpm install --frozen-lockfile

      # Anon anahtar programın içine zaten gömülür (gizli değil); sır yalnız token'lar.
      - name: .env yaz
        working-directory: kaynak
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=https://jnnpriynezdpnekrugsb.supabase.co"
            echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpubnByaXluZXpkcG5la3J1Z3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1Mjk5MjYsImV4cCI6MjEwOTEwNTkyNn0.wjr2Nc79mBtfYhJKpasx46dqHTiKTgpjXxDLbvsUrXU"
          } > .env

      - name: git kimliği
        working-directory: kaynak
        shell: bash
        run: |
          git config user.name "Viziodex yayın"
          git config user.email "yayin@users.noreply.github.com"

      - name: Yayınla
        working-directory: kaynak
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: "0"
        run: pnpm yayinla ${{ inputs.kanal }} --evet
